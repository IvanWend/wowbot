; WowBot ESP32 firmware (PlatformIO).
; Target board: ESP32-S3 DevKitC-1 (N16R8) — 16 MB flash + 8 MB OPI PSRAM, native USB.
;
; Native USB CDC (GPIO19/20) is the laptop link: control tokens now, streamed audio in
; Phase 6. The board definition already sets ARDUINO_USB_MODE=1 (Hardware CDC+JTAG), so
; `Serial` maps to the native USB CDC — no extra flag needed. Baud is virtual on USB CDC
; (it's a USB pipe, not a UART), so 115200 is fine everywhere.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 = 16 MB flash. If the actual board is the 8 MB variant (N8R2/N8, no PSRAM),
; drop these two lines (or point partitions at default_8MB.csv and flash_size at 8MB).
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

lib_deps =
    madhephaestus/ESP32Servo@^1.2.0
    adafruit/Adafruit DotStar@^1.2.5

build_flags =
    -D CORE_DEBUG_LEVEL=1
