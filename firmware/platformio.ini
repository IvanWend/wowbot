; WowBot ESP32 firmware (PlatformIO).
; Target board: Maker-ESP32 V1.8 — treated as an ESP32-WROOM-32 DevKit clone.
; VERIFY the pinout with a multimeter before wiring anything (docs/ROADMAP.md).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo@^1.2.0
    adafruit/Adafruit DotStar@^1.2.5
    ; The speech module (DFRobot Gravity Speech Synthesis V2.0) is driven manually over
    ; UART2 (see speech_controller.cpp), so no library is required.

build_flags =
    -D CORE_DEBUG_LEVEL=1
